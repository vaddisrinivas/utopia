version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      root-deps:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/server"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      server-deps:
        patterns:
          - "*"
