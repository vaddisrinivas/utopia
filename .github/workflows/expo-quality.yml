name: Expo quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: expo-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Web and Android quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install server dependencies
        run: npm ci --prefix server --no-audit --no-fund

      - name: Install pinned supply-chain scanners
        env:
          OSV_SCANNER_VERSION: v1.9.1
          SYFT_VERSION: v1.14.3
        run: |
          set -euo pipefail
          export GOBIN="${RUNNER_TEMP}/utopia-scan-tools/bin"
          mkdir -p "$GOBIN"
          echo "$GOBIN" >> "$GITHUB_PATH"
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@${OSV_SCANNER_VERSION}
          go install github.com/anchore/syft/v1/cmd/syft@${SYFT_VERSION}
          go version
          osv-scanner --version
          syft version

      - name: Run OSV gate
        env:
          QUALITY_GATE_ROOT: ${{ github.workspace }}
          OSV_SCANNER_CMD: osv-scanner
          OSV_SCANNER_ARGS: --recursive . --format json
          OSV_REPORT_PATH: app/build/evidence/osv-report.json
          OSV_GATE_POLICY_PATH: scripts/quality/security/osv-gate-policy.json
        run: node scripts/quality/security/check-osv-gate.mjs

      - name: Run SBOM gate
        env:
          QUALITY_GATE_ROOT: ${{ github.workspace }}
          SYFT_CMD: syft
          SYFT_ARGS: . -o json
          RELEASE_SBOM_PATH: app/build/evidence/sbom.json
          SBOM_GATE_POLICY_PATH: scripts/quality/sbom/sbom-policy.json
        run: node scripts/quality/sbom/check-sbom-gate.mjs

      - name: Validate domain package
        run: npm run config:validate

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Validate Expo dependencies
        run: npm run doctor

      - name: Export static web app
        run: npm run export:web

      - name: Export Android bundle
        run: npm run export:android

      - name: Upload export evidence
        uses: actions/upload-artifact@v7
        with:
          name: expo-exports
          path: |
            dist/web
            dist/android
            app/build/evidence/osv-report.json
            app/build/evidence/sbom.json
          if-no-files-found: error
